name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: olauncher-debug
          path: app/build/outputs/apk/debug/*.apk

      # Also keep the APK on the "apk" branch, so it can be fetched with git (no Actions UI needed)
      - name: Publish APK to the apk branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          out=$(mktemp -d)
          cp "$apk" "$out/olauncher-${GITHUB_REF_NAME}-debug.apk"
          cd "$out"
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -q -m "Debug APK from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
