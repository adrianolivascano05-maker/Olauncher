name: Build personal APK

on:
  push:
    branches-ignore:
      - apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The personal signing key lives only in the repository secrets
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing KEYSTORE_BASE64 or KEYSTORE_PASSWORD secret: add both under Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: olauncher
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/olauncher-personal.apk"

      # Refuse to ship an APK that can reach the network or read the screen
      - name: Check permissions and signature
        run: |
          set -eo pipefail
          apk="$RUNNER_TEMP/olauncher-personal.apk"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $bt"

          echo "Permissions in the APK:"
          "$bt/aapt2" dump permissions "$apk" > "$RUNNER_TEMP/perms.txt"
          cat "$RUNNER_TEMP/perms.txt"
          if grep -q "android.permission.INTERNET" "$RUNNER_TEMP/perms.txt"; then
            echo "::error::The APK requests INTERNET"; exit 1
          fi

          # Dump to a file first so a failing aapt2 stops the job instead of passing the check
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$RUNNER_TEMP/manifest.txt"
          if grep -q "BIND_ACCESSIBILITY_SERVICE" "$RUNNER_TEMP/manifest.txt"; then
            echo "::error::The APK declares an accessibility service"; exit 1
          fi
          echo "OK: no INTERNET permission, no accessibility service"

          # apksigner exits non-zero if the signature is invalid
          echo "Signature:"
          "$bt/apksigner" verify --verbose --print-certs "$apk" 2>&1 | grep -v "^WARNING"

      # Also keep the APK on the "apk" branch, so it can be fetched with git (no Actions UI needed)
      - name: Publish APK to the apk branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          out=$(mktemp -d)
          cp "$RUNNER_TEMP/olauncher-personal.apk" "$out/"
          cd "$out"
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -q -m "Personal APK from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} (versionCode $((1000 + GITHUB_RUN_NUMBER)))"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: olauncher-personal
          path: ${{ runner.temp }}/olauncher-personal.apk
